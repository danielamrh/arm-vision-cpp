[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Upload über eingebauten JTAG (umgeht COM-Port-Probleme)
upload_protocol = esp-builtin
debug_tool = esp-builtin
monitor_speed = 115200

; Route Arduino's `Serial` to the native USB port (USB-Serial/JTAG, VID 303A PID 1001),
; the same cable used for flashing. Without this, Serial goes to UART0 (the other
; USB-C port labelled UART) and the host never gets an answer on the native port.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32Servo Library
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
